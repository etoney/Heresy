name: Build Heresy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Render test (all presets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libfreetype-dev libfontconfig1-dev libasound2-dev libgl1-mesa-dev
      - name: Build render test
        run: |
          cmake -B build-test -G Ninja -DCMAKE_BUILD_TYPE=Release -DHERESY_PLUGIN=OFF -DHERESY_TESTS=ON
          cmake --build build-test
      - name: Render every factory preset
        run: |
          BIN=$(find build-test -type f -name HeresyRender -perm -u+x | head -1)
          "$BIN" renders
      - uses: actions/upload-artifact@v4
        with:
          name: Heresy-preset-renders
          path: renders/*.wav
          retention-days: 14

  mac:
    name: macOS installer (AU, VST3, app)
    runs-on: macos-latest
    env:
      MACOS_CERT_APP_P12: ${{ secrets.MACOS_CERT_APP_P12 }}
      MACOS_CERT_INSTALLER_P12: ${{ secrets.MACOS_CERT_INSTALLER_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^project(Heresy VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Configure (universal binary)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target Heresy_AU Heresy_VST3 Heresy_Standalone -- -quiet
      - name: Import Developer ID certificates
        if: env.MACOS_CERT_APP_P12 != '' && env.MACOS_CERT_INSTALLER_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERT_APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MACOS_CERT_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          APP=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          INST=$(security find-identity -v -p basic "$KC" | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "APP_IDENTITY=$APP" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INST" >> "$GITHUB_ENV"
      - name: UI snapshot
        continue-on-error: true
        run: |
          cmake --build build --config Release --target HeresySnapshot -- -quiet
          BIN=$(find build -type f -name HeresySnapshot -perm -u+x | head -1)
          mkdir -p snapshots
          "$BIN" "$PWD/snapshots/heresy-ui.png" 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Heresy-ui-snapshot
          path: snapshots/*.png
          if-no-files-found: ignore
      - name: Build installer
        run: installer/mac/build_pkg.sh "${{ steps.v.outputs.version }}" build/Heresy_artefacts/Release dist
      - uses: actions/upload-artifact@v4
        with:
          name: Heresy-mac
          path: dist/*.pkg

  windows:
    name: Windows installer (VST3, app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/^project(Heresy VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target Heresy_VST3 Heresy_Standalone
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" "/DArtefacts=$PWD\build\Heresy_artefacts\Release" "/DOutDir=$PWD\dist" installer\windows\heresy.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Heresy-windows
          path: dist/*.exe

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Heresy-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg
            dist/*.exe
